<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaidCanvas Dev Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100%;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .studio-canvas { min-width: 0; min-height: 0; }
      @media (max-width: 900px) {
        #root header { overflow-x: auto; flex-shrink: 0; gap: 16px; }
        #root header > div { flex-shrink: 0; }
        .studio-main { flex-direction: column; }
        .studio-main > aside { display: none !important; }
        .studio-inspector { width: 100% !important; height: 32vh; flex-shrink: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
