<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Lead Role Stencil (Awakened Two-Tap) — Option A 60% Helm Console</title>
  <desc>AOAIM Lead Role Palette and Inspector Stencil in Awakened Two-Tap State.</desc>
  <rect width="48" height="48" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2.0" />
  <rect x="2" y="2" width="44" height="44" rx="6" fill="rgba(16, 185, 129, 0.08)" />
  <!-- Console baseline line -->
  <line x1="8" y1="34" x2="40" y2="34" stroke="#2D3139" stroke-width="2" stroke-linecap="round" />
  <!-- 60% Wheel rising from console baseline (24, 33) rotated 22.5 deg with Emerald Rim -->
  <g transform="translate(24, 33) rotate(22.5)">
    <!-- 5 Upper Spokes -->
    <g stroke="#C5A059" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-17" />
      <line x1="0" y1="0" x2="17" y2="0" />
      <line x1="0" y1="0" x2="-17" y2="0" />
      <line x1="0" y1="0" x2="12" y2="-12" />
      <line x1="0" y1="0" x2="-12" y2="-12" />
    </g>
    <!-- Upper Arch Rim glowing with Emerald -->
    <path d="M -12 0 A 12 12 0 1 1 12 0" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
    <!-- 5 Handle Pegs on Upper Spokes -->
    <path d="M -1.5 -17 A 1.5 1.5 0 1 1 1.5 -17 A 1.5 1.5 0 1 1 -1.5 -17 Z M 15.5 0 A 1.5 1.5 0 1 1 18.5 0 A 1.5 1.5 0 1 1 15.5 0 Z M -18.5 0 A 1.5 1.5 0 1 1 -15.5 0 A 1.5 1.5 0 1 1 -18.5 0 Z M 10.5 -12 A 1.5 1.5 0 1 1 13.5 -12 A 1.5 1.5 0 1 1 10.5 -12 Z M -13.5 -12 A 1.5 1.5 0 1 1 -10.5 -12 A 1.5 1.5 0 1 1 -13.5 -12 Z" fill="#C5A059" />
    <!-- Half Hub Boss at baseline -->
    <path d="M -4.2 0 A 4.2 4.2 0 0 1 4.2 0 Z" fill="#C5A059" />
    <circle cx="0" cy="-1" r="1.3" fill="#FAF8F5" stroke="#2D3139" stroke-width="0.8" />
  </g>
</svg>
