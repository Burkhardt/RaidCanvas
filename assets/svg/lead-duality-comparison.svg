<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="340" height="160">
  <title>AOAIM Lead Role Duality — Dormant vs Awakened</title>
  <desc>Side-by-side comparison of the Sketch Offset (Δ = 45.0°) Helmsman in Dormant state and Awakened state with Portuguese Duality.</desc>
  <defs>
    <clipPath id="duality-cut-1">
      <rect x="0" y="0" width="120" height="54" />
    </clipPath>
    <clipPath id="duality-cut-2">
      <rect x="0" y="0" width="120" height="54" />
    </clipPath>
  </defs>

  <rect width="340" height="160" fill="#FAF8F5" rx="8" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- LEFT: Dormant State -->
  <g transform="translate(25, 20)">
    <text x="60" y="0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">DORMANT (AT REST)</text>
    <!-- Head -->
    <circle cx="60" cy="20" r="12" fill="#FAF8F5" stroke="#2D3139" stroke-width="2.2" />
    <!-- Helm Wheel -->
    <g clip-path="url(#duality-cut-1)" stroke="#C5A059" stroke-linecap="round">
      <line x1="48" y1="58" x2="30.6" y2="53.3" stroke-width="2.0" />
      <line x1="48" y1="58" x2="39.0" y2="42.4" stroke-width="2.0" />
      <line x1="48" y1="58" x2="52.7" y2="40.6" stroke-width="2.0" />
      <line x1="48" y1="58" x2="63.6" y2="49.0" stroke-width="2.0" />
      <path d="M 30.6 53.3 A 18 18 0 0 1 63.6 49.0" fill="none" stroke-width="2.2" />
      <!-- Handles -->
      <line x1="30.6" y1="53.3" x2="26.3" y2="52.2" stroke-width="2.0" />
      <circle cx="25.5" cy="52.0" r="1.5" fill="#C5A059" />
      <line x1="39.0" y1="42.4" x2="36.8" y2="38.5" stroke-width="2.0" />
      <circle cx="36.0" cy="37.5" r="1.5" fill="#C5A059" />
      <line x1="52.7" y1="40.6" x2="53.8" y2="36.3" stroke-width="2.0" />
      <circle cx="54.0" cy="35.5" r="1.5" fill="#C5A059" />
      <line x1="63.6" y1="49.0" x2="67.5" y2="46.8" stroke-width="2.0" />
      <circle cx="68.5" cy="46.2" r="1.5" fill="#C5A059" />
    </g>
    <!-- Torso with right arm clasping peg -->
    <path d="M 39 54 v -6 a 10 10 0 0 1 10 -10 H 71 a 10 10 0 0 1 10 10 v 6 L 68 47" 
          fill="none" stroke="#2D3139" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="74" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" font-style="italic" fill="#2D3139" text-anchor="middle">«Lead»</text>
    <text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0D3472" text-anchor="middle">Captain</text>
  </g>

  <!-- RIGHT: Awakened State -->
  <g transform="translate(195, 20)">
    <text x="60" y="0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">AWAKENED (PORTAL ACTIVE)</text>
    <!-- Portuguese Duality: Emerald Door Wash on Right Hemisphere -->
    <path d="M 60 8 A 12 12 0 0 1 60 32 Z M 60 38 H 71 a 10 10 0 0 1 10 10 v 6 H 60 Z" fill="rgba(16, 185, 129, 0.25)" />
    <!-- Vertical Gold Seam -->
    <line x1="60" y1="8" x2="60" y2="54" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Chevron -->
    <text x="82" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="rgba(16, 185, 129, 0.85)" text-anchor="middle">›</text>

    <!-- Head -->
    <circle cx="60" cy="20" r="12" fill="none" stroke="#2D3139" stroke-width="2.2" />
    <!-- Helm Wheel -->
    <g clip-path="url(#duality-cut-2)" stroke="#C5A059" stroke-linecap="round">
      <line x1="48" y1="58" x2="30.6" y2="53.3" stroke-width="2.0" />
      <line x1="48" y1="58" x2="39.0" y2="42.4" stroke-width="2.0" />
      <line x1="48" y1="58" x2="52.7" y2="40.6" stroke-width="2.0" />
      <line x1="48" y1="58" x2="63.6" y2="49.0" stroke-width="2.0" />
      <path d="M 30.6 53.3 A 18 18 0 0 1 63.6 49.0" fill="none" stroke-width="2.2" />
      <!-- Handles -->
      <line x1="30.6" y1="53.3" x2="26.3" y2="52.2" stroke-width="2.0" />
      <circle cx="25.5" cy="52.0" r="1.5" fill="#C5A059" />
      <line x1="39.0" y1="42.4" x2="36.8" y2="38.5" stroke-width="2.0" />
      <circle cx="36.0" cy="37.5" r="1.5" fill="#C5A059" />
      <line x1="52.7" y1="40.6" x2="53.8" y2="36.3" stroke-width="2.0" />
      <circle cx="54.0" cy="35.5" r="1.5" fill="#C5A059" />
      <line x1="63.6" y1="49.0" x2="67.5" y2="46.8" stroke-width="2.0" />
      <circle cx="68.5" cy="46.2" r="1.5" fill="#C5A059" />
    </g>
    <!-- Torso with right arm clasping peg -->
    <path d="M 39 54 v -6 a 10 10 0 0 1 10 -10 H 71 a 10 10 0 0 1 10 10 v 6 L 68 47" 
          fill="none" stroke="#2D3139" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="74" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" font-style="italic" fill="#2D3139" text-anchor="middle">«Lead»</text>
    <text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0D3472" text-anchor="middle">Captain</text>
  </g>
</svg>
