<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 115" width="500" height="230">
  <title>AOAIM Lead Role: Two-Tap Duality Comparison</title>
  <desc>Dormant (Left) vs Awakened Two-Tap (Right) State for Lead Role Node.</desc>
  <!-- DORMANT STATE (LEFT) -->
  <g transform="translate(5, 0)">
    <rect x="0" y="5" width="115" height="105" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="57.5" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">DORMANT (IN REST)</text>
    
    <!-- Actor Body -->
    <g stroke="#2D3139" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="57.5" cy="34" r="8" fill="#FAF8F5" />
      <line x1="57.5" y1="42" x2="57.5" y2="66" />
      <line x1="57.5" y1="48" x2="49" y2="59.5" />
      <line x1="57.5" y1="48" x2="66" y2="59.5" />
      <line x1="57.5" y1="66" x2="45" y2="82" />
      <line x1="57.5" y1="66" x2="70" y2="82" />
    </g>

    <!-- Dormant Wheel -->
    <g transform="translate(39.5, 47)">
      <g stroke="#C5A059" stroke-width="1.8" stroke-linecap="round">
        <line x1="0" y1="18" x2="36" y2="18" />
        <line x1="18" y1="0" x2="18" y2="36" />
        <line x1="5.3" y1="5.3" x2="30.7" y2="30.7" />
        <line x1="30.7" y1="5.3" x2="5.3" y2="30.7" />
      </g>
      <circle cx="18" cy="18" r="11.5" fill="none" stroke="#C5A059" stroke-width="1.8" />
      <path d="M 16.5 0 A 1.5 1.5 0 1 1 19.5 0 A 1.5 1.5 0 1 1 16.5 0 Z M 16.5 36 A 1.5 1.5 0 1 1 19.5 36 A 1.5 1.5 0 1 1 16.5 36 Z M -1.5 18 A 1.5 1.5 0 1 1 1.5 18 A 1.5 1.5 0 1 1 -1.5 18 Z M 34.5 18 A 1.5 1.5 0 1 1 37.5 18 A 1.5 1.5 0 1 1 34.5 18 Z M 3.8 5.3 A 1.5 1.5 0 1 1 6.8 5.3 A 1.5 1.5 0 1 1 3.8 5.3 Z M 29.2 5.3 A 1.5 1.5 0 1 1 32.2 5.3 A 1.5 1.5 0 1 1 29.2 5.3 Z M 3.8 30.7 A 1.5 1.5 0 1 1 6.8 30.7 A 1.5 1.5 0 1 1 3.8 30.7 Z M 29.2 30.7 A 1.5 1.5 0 1 1 32.2 30.7 A 1.5 1.5 0 1 1 29.2 30.7 Z" fill="#C5A059" />
      <path d="M 14 18 A 4 4 0 1 1 22 18 A 4 4 0 1 1 14 18 Z" fill="#C5A059" />
      <path d="M 16.5 18 A 1.5 1.5 0 1 1 19.5 18 A 1.5 1.5 0 1 1 16.5 18 Z" fill="#FAF8F5" stroke="none" />
      <!-- Hands -->
      <path d="M 5.5 12.5 A 2.5 2.5 0 1 1 10.5 12.5 A 2.5 2.5 0 1 1 5.5 12.5 Z M 25.5 12.5 A 2.5 2.5 0 1 1 30.5 12.5 A 2.5 2.5 0 1 1 25.5 12.5 Z" fill="#FAF8F5" stroke="#2D3139" stroke-width="1.4" />
    </g>
    <text x="57.5" y="99" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2D3139">Captain</text>
  </g>

  <!-- AWAKENED TWO-TAP STATE (RIGHT) -->
  <g transform="translate(130, 0)">
    <rect x="0" y="5" width="115" height="105" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8" />
    <text x="57.5" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#10B981" letter-spacing="0.08em">AWAKENED (TWO-TAP)</text>
    
    <!-- Portal Door Fill (Emerald Glow) -->
    <path d="M 12 10 Q 57.5 10 57.5 25 V 85 Q 57.5 100 12 100 Z" fill="rgba(16, 185, 129, 0.08)" />

    <!-- Actor Body -->
    <g stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="57.5" cy="34" r="8" fill="#FAF8F5" stroke="#2D3139" stroke-width="2" />
      <line x1="57.5" y1="42" x2="57.5" y2="66" stroke="#2D3139" />
      <line x1="57.5" y1="48" x2="49" y2="59.5" stroke="#2D3139" />
      <line x1="57.5" y1="48" x2="66" y2="59.5" stroke="#2D3139" />
      <line x1="57.5" y1="66" x2="45" y2="82" stroke="#2D3139" />
      <line x1="57.5" y1="66" x2="70" y2="82" stroke="#2D3139" />
    </g>

    <!-- Wheel with Emerald Rim -->
    <g transform="translate(39.5, 47)">
      <g stroke="#C5A059" stroke-width="1.8" stroke-linecap="round">
        <line x1="0" y1="18" x2="36" y2="18" />
        <line x1="18" y1="0" x2="18" y2="36" />
        <line x1="5.3" y1="5.3" x2="30.7" y2="30.7" />
        <line x1="30.7" y1="5.3" x2="5.3" y2="30.7" />
      </g>
      <circle cx="18" cy="18" r="11.5" fill="none" stroke="#10B981" stroke-width="2.2" />
      <path d="M 16.5 0 A 1.5 1.5 0 1 1 19.5 0 A 1.5 1.5 0 1 1 16.5 0 Z M 16.5 36 A 1.5 1.5 0 1 1 19.5 36 A 1.5 1.5 0 1 1 16.5 36 Z M -1.5 18 A 1.5 1.5 0 1 1 1.5 18 A 1.5 1.5 0 1 1 -1.5 18 Z M 34.5 18 A 1.5 1.5 0 1 1 37.5 18 A 1.5 1.5 0 1 1 34.5 18 Z M 3.8 5.3 A 1.5 1.5 0 1 1 6.8 5.3 A 1.5 1.5 0 1 1 3.8 5.3 Z M 29.2 5.3 A 1.5 1.5 0 1 1 32.2 5.3 A 1.5 1.5 0 1 1 29.2 5.3 Z M 3.8 30.7 A 1.5 1.5 0 1 1 6.8 30.7 A 1.5 1.5 0 1 1 3.8 30.7 Z M 29.2 30.7 A 1.5 1.5 0 1 1 32.2 30.7 A 1.5 1.5 0 1 1 29.2 30.7 Z" fill="#C5A059" />
      <path d="M 14 18 A 4 4 0 1 1 22 18 A 4 4 0 1 1 14 18 Z" fill="#C5A059" />
      <path d="M 16.5 18 A 1.5 1.5 0 1 1 19.5 18 A 1.5 1.5 0 1 1 16.5 18 Z" fill="#FAF8F5" stroke="none" />
      <!-- Hands -->
      <path d="M 5.5 12.5 A 2.5 2.5 0 1 1 10.5 12.5 A 2.5 2.5 0 1 1 5.5 12.5 Z M 25.5 12.5 A 2.5 2.5 0 1 1 30.5 12.5 A 2.5 2.5 0 1 1 25.5 12.5 Z" fill="#FAF8F5" stroke="#2D3139" stroke-width="1.4" />
    </g>
    <!-- Chevron indicator on right edge -->
    <text x="106" y="58" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">›</text>
    <text x="57.5" y="99" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2D3139">Captain</text>
  </g>
</svg>
