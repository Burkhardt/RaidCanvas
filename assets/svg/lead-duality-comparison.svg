<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 115" width="500" height="230">
  <title>AOAIM Lead Role: Two-Tap Duality Comparison (Option A: 60% Helm Console)</title>
  <desc>Dormant (Left) vs Awakened Two-Tap (Right) State for Option A Lead Helm Console.</desc>
  <!-- DORMANT STATE (LEFT) -->
  <g transform="translate(5, 0)">
    <rect x="0" y="5" width="115" height="105" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="57.5" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">DORMANT (IN REST)</text>
    
    <!-- Actor Body in WarmGraphite (#2D3139) -->
    <circle cx="57.5" cy="27" r="10" fill="#FAF8F5" stroke="#2D3139" stroke-width="2" />
    <path d="M 75 56 v -5 a 8 8 0 0 0 -8 -8 H 48.5 a 8 8 0 0 0 -8 8 v 5 H 40.5" fill="none" stroke="#2D3139" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 60% Helm Console (rotated 22.5 deg) -->
    <g transform="translate(57.5, 56) rotate(22.5)">
      <g stroke="#C5A059" stroke-width="1.8" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-16" />
        <line x1="0" y1="0" x2="16" y2="0" />
        <line x1="0" y1="0" x2="-16" y2="0" />
        <line x1="0" y1="0" x2="11.3" y2="-11.3" />
        <line x1="0" y1="0" x2="-11.3" y2="-11.3" />
      </g>
      <path d="M -11.3 0 A 11.3 11.3 0 1 1 11.3 0" fill="none" stroke="#C5A059" stroke-width="2.0" stroke-linecap="round" />
      <g fill="#C5A059">
        <circle cx="0" cy="-16" r="1.4" />
        <circle cx="16" cy="0" r="1.4" />
        <circle cx="-16" cy="0" r="1.4" />
        <circle cx="11.3" cy="-11.3" r="1.4" />
        <circle cx="-11.3" cy="-11.3" r="1.4" />
      </g>
      <path d="M -4 0 A 4 4 0 0 1 4 0 Z" fill="#C5A059" />
      <circle cx="0" cy="-0.8" r="1.2" fill="#FAF8F5" stroke="#2D3139" stroke-width="0.7" />
    </g>

    <!-- Labels with 22px+ clearance -->
    <text x="57.5" y="79" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-style="italic" fill="#2D3139">Interaction Lead</text>
    <text x="57.5" y="94" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0D3472">Captain</text>
  </g>

  <!-- AWAKENED TWO-TAP STATE (RIGHT) -->
  <g transform="translate(130, 0)">
    <rect x="0" y="5" width="115" height="105" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8" />
    <text x="57.5" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#10B981" letter-spacing="0.08em">AWAKENED (TWO-TAP)</text>
    
    <!-- Portal Door Fill (Emerald Glow) -->
    <path d="M 57.5 10 Q 95 10 95 25 V 85 Q 95 100 57.5 100 Z" fill="rgba(16, 185, 129, 0.08)" />

    <!-- Actor Body in WarmGraphite (#2D3139) -->
    <circle cx="57.5" cy="27" r="10" fill="#FAF8F5" stroke="#2D3139" stroke-width="2" />
    <path d="M 75 56 v -5 a 8 8 0 0 0 -8 -8 H 48.5 a 8 8 0 0 0 -8 8 v 5 H 40.5" fill="none" stroke="#2D3139" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 60% Helm Console with Emerald Rim Arch -->
    <g transform="translate(57.5, 56) rotate(22.5)">
      <g stroke="#C5A059" stroke-width="1.8" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-16" />
        <line x1="0" y1="0" x2="16" y2="0" />
        <line x1="0" y1="0" x2="-16" y2="0" />
        <line x1="0" y1="0" x2="11.3" y2="-11.3" />
        <line x1="0" y1="0" x2="-11.3" y2="-11.3" />
      </g>
      <!-- Rim glows Emerald in Awakened state -->
      <path d="M -11.3 0 A 11.3 11.3 0 1 1 11.3 0" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
      <g fill="#C5A059">
        <circle cx="0" cy="-16" r="1.4" />
        <circle cx="16" cy="0" r="1.4" />
        <circle cx="-16" cy="0" r="1.4" />
        <circle cx="11.3" cy="-11.3" r="1.4" />
        <circle cx="-11.3" cy="-11.3" r="1.4" />
      </g>
      <path d="M -4 0 A 4 4 0 0 1 4 0 Z" fill="#C5A059" />
      <circle cx="0" cy="-0.8" r="1.2" fill="#FAF8F5" stroke="#2D3139" stroke-width="0.7" />
    </g>

    <!-- Chevron indicator on right edge -->
    <text x="106" y="58" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">›</text>

    <!-- Labels with 22px+ clearance -->
    <text x="57.5" y="79" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-style="italic" fill="#2D3139">Interaction Lead</text>
    <text x="57.5" y="94" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0D3472">Captain</text>
  </g>
</svg>
