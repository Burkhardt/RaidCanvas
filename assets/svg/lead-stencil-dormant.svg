<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Lead Role Stencil (Dormant) — Sketch Offset Helmsman</title>
  <desc>AOAIM Lead Role Palette and Inspector Stencil with Sketch Offset Rudder Wheel.</desc>
  <defs>
    <clipPath id="stencil-cut-dormant">
      <rect x="0" y="0" width="48" height="36" />
    </clipPath>
  </defs>
  <rect width="48" height="48" rx="8" fill="#FAF8F5" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Chest baseline horizon -->
  <line x1="8" y1="36" x2="40" y2="36" stroke="#2D3139" stroke-width="1.8" stroke-linecap="round" />
  <!-- Wheel offset to (21, 39) with R=12 -->
  <g clip-path="url(#stencil-cut-dormant)" stroke="#C5A059" stroke-linecap="round">
    <line x1="21" y1="39" x2="9.4" y2="35.9" stroke-width="1.8" />
    <line x1="21" y1="39" x2="15.0" y2="28.6" stroke-width="1.8" />
    <line x1="21" y1="39" x2="24.1" y2="27.4" stroke-width="1.8" />
    <line x1="21" y1="39" x2="31.4" y2="33.0" stroke-width="1.8" />
    <path d="M 9.4 35.9 A 12 12 0 0 1 31.4 33.0" fill="none" stroke-width="1.8" />
    <!-- Handle Pegs -->
    <line x1="9.4" y1="35.9" x2="6.5" y2="35.1" stroke-width="1.8" />
    <circle cx="6.0" cy="35.0" r="1.0" fill="#C5A059" />
    <line x1="15.0" y1="28.6" x2="13.5" y2="26.0" stroke-width="1.8" />
    <circle cx="13.0" cy="25.3" r="1.0" fill="#C5A059" />
    <line x1="24.1" y1="27.4" x2="24.9" y2="24.5" stroke-width="1.8" />
    <circle cx="25.0" cy="24.0" r="1.0" fill="#C5A059" />
    <line x1="31.4" y1="33.0" x2="34.0" y2="31.5" stroke-width="1.8" />
    <circle cx="34.7" cy="31.1" r="1.0" fill="#C5A059" />
  </g>
  <!-- Actor right arm clasping at 30 deg peg -->
  <path d="M 37 36 L 34.7 31.1" fill="none" stroke="#2D3139" stroke-width="1.8" stroke-linecap="round" />
</svg>
