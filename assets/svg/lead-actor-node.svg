<svg width="120" height="110" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
  <title>AOAIM Lead Actor Node — Option A: The 60% Helm Console (Rainer's Concept ★)</title>
  <desc>Actor head &amp; torso in Warm Graphite (#2D3139); top 60% of wheel rising from console baseline (y=54) rotated 22.5 deg in Net Gold (#C5A059); 22px+ clear optical buffer to labels.</desc>
  <!-- 1. Actor Body & Head in Warm Graphite (#2D3139) -->
  <circle cx="60" cy="20" r="12" fill="#FAF8F5" stroke="#2D3139" stroke-width="2.2" />
  <path d="M 81 54 v -6 a 10 10 0 0 0 -10 -10 H 49 a 10 10 0 0 0 -10 10 v 6 H 39" 
        fill="none" stroke="#2D3139" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. Top 60% Wheel rising from baseline (Net Gold #C5A059, rotated 22.5 deg) -->
  <g transform="translate(60, 54) rotate(22.5)">
    <!-- 5 Upper Spokes -->
    <g stroke="#C5A059" stroke-width="2.0" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-18" />
      <line x1="0" y1="0" x2="18" y2="0" />
      <line x1="0" y1="0" x2="-18" y2="0" />
      <line x1="0" y1="0" x2="12.7" y2="-12.7" />
      <line x1="0" y1="0" x2="-12.7" y2="-12.7" />
    </g>
    <!-- Upper Rim Arch -->
    <path d="M -12.7 0 A 12.7 12.7 0 1 1 12.7 0" fill="none" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round" />
    <!-- 5 Handle Pegs on Upper Spokes (dual-semicircles) -->
    <path d="M -1.6 -18 A 1.6 1.6 0 1 1 1.6 -18 A 1.6 1.6 0 1 1 -1.6 -18 Z M 16.4 0 A 1.6 1.6 0 1 1 19.6 0 A 1.6 1.6 0 1 1 16.4 0 Z M -19.6 0 A 1.6 1.6 0 1 1 -16.4 0 A 1.6 1.6 0 1 1 -19.6 0 Z M 11.1 -12.7 A 1.6 1.6 0 1 1 14.3 -12.7 A 1.6 1.6 0 1 1 11.1 -12.7 Z M -14.3 -12.7 A 1.6 1.6 0 1 1 -11.1 -12.7 A 1.6 1.6 0 1 1 -14.3 -12.7 Z" fill="#C5A059" />
    <!-- Half Hub Boss at baseline -->
    <path d="M -4.5 0 A 4.5 4.5 0 0 1 4.5 0 Z" fill="#C5A059" />
    <!-- Center Axle Pin -->
    <path d="M -1.4 -1 A 1.4 1.4 0 1 1 1.4 -1 A 1.4 1.4 0 1 1 -1.4 -1 Z" fill="#FAF8F5" stroke="#2D3139" stroke-width="0.8" />
  </g>

  <!-- 3. Labels (Uncrowded, 22px clearance) -->
  <text x="60" y="78" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" font-style="italic" fill="#2D3139" text-anchor="middle">Interaction Lead</text>
  <text x="60" y="94" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0D3472" text-anchor="middle">Captain</text>
</svg>
