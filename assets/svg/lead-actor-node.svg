<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 115" width="120" height="115">
  <title>AOAIM Lead Actor Node (Helmsman)</title>
  <desc>1UCC Actor Node with calibrated Lead Helmsman ship's wheel, clasping hands, and 18px typographic buffer.</desc>
  <!-- Person Node Body (Smalltalk Actor) -->
  <g class="aim-person-body" stroke="#2D3139" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head (cx=60, cy=16, r=9.5) -->
    <circle cx="60" cy="16" r="9.5" fill="#FAF8F5" />
    <!-- Torso (y=25.5 to y=54) -->
    <line x1="60" y1="25.5" x2="60" y2="54" />
    <!-- Arms reaching to wheel (from shoulder 60,33 down to hand grip points 50,46.5 and 70,46.5) -->
    <line x1="60" y1="33" x2="50" y2="46.5" />
    <line x1="60" y1="33" x2="70" y2="46.5" />
    <!-- Legs (from 60,54 to 45,74 and 75,74) -->
    <line x1="60" y1="54" x2="45" y2="74" />
    <line x1="60" y1="54" x2="75" y2="74" />
  </g>

  <!-- Calibrated Helmsman Wheel (translated to cx-18=42, y=34 -> wheel center at 60, 52) -->
  <g class="aim-stereotype-lead" transform="translate(42, 34)">
    <!-- 8 Spokes extending to turned handle pegs -->
    <g stroke="#C5A059" stroke-width="2.0" stroke-linecap="round">
      <line x1="0" y1="18" x2="36" y2="18" />
      <line x1="18" y1="0" x2="18" y2="36" />
      <line x1="5.3" y1="5.3" x2="30.7" y2="30.7" />
      <line x1="30.7" y1="5.3" x2="5.3" y2="30.7" />
    </g>

    <!-- Outer Rim (R=11.5, stroke=2.0) -->
    <circle cx="18" cy="18" r="11.5" fill="none" stroke="#C5A059" stroke-width="2.0" />

    <!-- 8 Turned Handle Pegs at tips (R=1.5 dual-semicircle pairs for engine safety, fill NetGold) -->
    <path d="M 16.5 0 A 1.5 1.5 0 1 1 19.5 0 A 1.5 1.5 0 1 1 16.5 0 Z M 16.5 36 A 1.5 1.5 0 1 1 19.5 36 A 1.5 1.5 0 1 1 16.5 36 Z M -1.5 18 A 1.5 1.5 0 1 1 1.5 18 A 1.5 1.5 0 1 1 -1.5 18 Z M 34.5 18 A 1.5 1.5 0 1 1 37.5 18 A 1.5 1.5 0 1 1 34.5 18 Z M 3.8 5.3 A 1.5 1.5 0 1 1 6.8 5.3 A 1.5 1.5 0 1 1 3.8 5.3 Z M 29.2 5.3 A 1.5 1.5 0 1 1 32.2 5.3 A 1.5 1.5 0 1 1 29.2 5.3 Z M 3.8 30.7 A 1.5 1.5 0 1 1 6.8 30.7 A 1.5 1.5 0 1 1 3.8 30.7 Z M 29.2 30.7 A 1.5 1.5 0 1 1 32.2 30.7 A 1.5 1.5 0 1 1 29.2 30.7 Z" fill="#C5A059" />

    <!-- Hub Boss (R=4.0 dual-semicircle, fill NetGold) -->
    <path d="M 14 18 A 4 4 0 1 1 22 18 A 4 4 0 1 1 14 18 Z" fill="#C5A059" />

    <!-- Center Axle Pin (R=1.5 dual-semicircle solid ChalkWhite punch, stroke="none") -->
    <path d="M 16.5 18 A 1.5 1.5 0 1 1 19.5 18 A 1.5 1.5 0 1 1 16.5 18 Z" fill="#FAF8F5" stroke="none" />

    <!-- Hands gripping outer rim at 10:00 and 2:00 (R=2.5 dual-semicircles) -->
    <!-- Drawn ON TOP of the rim with solid ChalkWhite fill and Anthracite outline to cleanly occlude and clasp -->
    <path d="M 5.5 12.5 A 2.5 2.5 0 1 1 10.5 12.5 A 2.5 2.5 0 1 1 5.5 12.5 Z M 25.5 12.5 A 2.5 2.5 0 1 1 30.5 12.5 A 2.5 2.5 0 1 1 25.5 12.5 Z" fill="#FAF8F5" stroke="#2D3139" stroke-width="1.4" />
  </g>

  <!-- Typography with 18px optical buffer from lowest spoke tip (y=70) to baseline (y=88) -->
  <text x="60" y="88" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#C5A059" letter-spacing="0.04em">«Lead»</text>
  <text x="60" y="102" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2D3139">Captain</text>
</svg>
